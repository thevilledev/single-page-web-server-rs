[package]
name = "single-page-web-server-rs"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[dependencies]
md5 = "0.7"
httpdate = "1.0"
bytes = "1.7"
hyper = { version = "1.4", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4.4", features = ["derive", "env"] }
flate2 = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
opentelemetry = { version = "0.24", features = ["metrics"] }
opentelemetry-prometheus = "0.17"
opentelemetry_sdk = { version = "0.24", features = ["metrics", "rt-tokio"] }
prometheus = "0.13"
rcgen = "0.11"
rustls = "0.21"
tokio-rustls = "0.24"
time = "0.3"
async-stream = "0.3"
tokio-stream = { version = "0.1", features = ["net"] }
socket2 = { version = "0.5", features = ["all"] }

[workspace.metadata.dist]
cargo-dist-version = "0.8.1"
rust-toolchain-version = "1.75"
targets = ["x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin"]
ci = ["github"]
installers = ["shell", "powershell"]

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
tempfile = "3.2"
temp-env = "0.3"
criterion = { version = "0.5", features = ["async_tokio"] }
memoffset = "0.9"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }

[[bench]]
name = "bench"
harness = false
